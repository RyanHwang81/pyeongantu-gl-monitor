# 이 파일은 .github/workflows/update.yml 경로에 저장하세요
name: GL 레짐 모니터 자동 갱신

on:
  schedule:
    # 매월 1일·16일 09:00 UTC (= 한국시간 18:00) 실행
    # FRED 지표는 익월 중순에 확정되므로 월 2회 실행해 신규 월을 놓치지 않습니다
    - cron: "0 9 1,16 * *"
  workflow_dispatch:        # 필요 시 수동 실행

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install pandas numpy

      - name: 데이터 갱신 및 빌드
        # FRED graph CSV occasionally times out from hosted runners. Keep the
        # provided build.py calculation untouched and retry the whole fetch/build.
        run: |
          for attempt in 1 2 3; do
            echo "[build] FRED fetch/build attempt ${attempt}/3"
            if python build.py --out dist; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 30))
            fi
          done
          exit 1

      - name: 변경사항 커밋
        run: |
          git config user.name  "gl-bot"
          git config user.email "gl-bot@users.noreply.github.com"
          git add dist
          if git diff --staged --quiet; then
            echo "변경 없음 — 신규 데이터가 아직 발표되지 않았습니다"
          else
            git commit -m "chore: GL 데이터 자동 갱신 ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: GitHub Pages 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
