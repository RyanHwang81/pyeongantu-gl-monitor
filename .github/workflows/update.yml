# 이 파일은 .github/workflows/update.yml 경로에 저장하세요
name: GL 레짐 모니터 자동 갱신

on:
  schedule:
    # 매월 1일·16일 09:00 UTC (= 한국시간 18:00) 실행
    # FRED 지표는 익월 중순에 확정되므로 월 2회 실행해 신규 월을 놓치지 않습니다
    - cron: "0 9 1,16 * *"
  workflow_dispatch:        # 필요 시 수동 실행
    inputs:
      runner:
        description: "빌드 러너 (mac = 예비 셀프호스트 맥미니)"
        type: choice
        options: [ubuntu, mac]
        default: ubuntu
  # PR에서는 빌드·검증만 하고 커밋·배포는 하지 않습니다.
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/update.yml
      - requirements.txt
      - build.py
      - model_v2.py
      - model_v3.py
      - scripts/check_dist_model.py
      - localization.py
      - gl_template.html
      - book_dashboard.json

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

# 정기 실행과 수동 실행이 겹쳐 dist 커밋이 충돌하지 않게 한 번에 하나만 돕니다.
concurrency:
  group: gl-update-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  build:
    # FRED graph CSV는 러너에서 timeout 되므로 공식 API(FRED_API_KEY)로 수집합니다.
    # 기본은 GitHub 호스티드 ubuntu. 맥미니 셀프호스트 러너는 수동 실행 시 예비로 선택합니다.
    runs-on: ${{ inputs.runner == 'mac' && fromJSON('["self-hosted","macOS","gl-monitor"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      IS_PR: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - name: Python 설정 (GitHub 호스티드)
        if: runner.environment == 'github-hosted'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 의존성 설치 (GitHub 호스티드)
        if: runner.environment == 'github-hosted'
        run: |
          python -m pip install -r requirements.txt
          python -c "import pandas, numpy, certifi; print('pandas', pandas.__version__, 'numpy', numpy.__version__)"

      - name: Python 경로 설정 (맥미니 예비 러너)
        if: runner.environment == 'self-hosted'
        run: |
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

      - name: 정량 모델·일곱 지표 동시 갱신 계약 테스트
        run: python3 -m unittest discover -s tests -v

      - name: 데이터 갱신 및 빌드
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          test -n "$FRED_API_KEY" || { echo "FRED_API_KEY repository secret missing"; exit 1; }
          CERTFILE=$(python3 -c 'import certifi; print(certifi.where())')
          SSL_CERT_FILE="$CERTFILE" python3 build.py --out dist

      - name: 배포 전 일곱 지표 현월 스냅샷 검증
        run: |
          python3 - <<'PY'
          import json, re
          from datetime import date
          from pathlib import Path
          html = Path("dist/index.html").read_text(encoding="utf-8")
          match = re.search(r"const BOOK = (\{.*?\});\s*const DATA =", html, re.S)
          assert match, "book dashboard missing from the public HTML"
          book = json.loads(match.group(1))
          meta, month = book["meta"], book["months"][-1]
          assert month["date"] == date.today().strftime("%Y-%m")
          assert len(month["indicators"]) == 7
          assert meta["observed_count"] + meta["pending_count"] == 7
          assert all(item["state"] == "pending" or item["as_of"].startswith(month["date"])
                     for item in month["indicators"].values())
          print("seven-gauge month/current-source contract OK", month["date"], meta["observed_count"], "/7")
          PY

      - name: dist 모델 버전 검사 (코드와 다르면 커밋·배포 중단)
        run: python3 scripts/check_dist_model.py dist

      - name: 커밋된 dist와 비교 (PR 전용)
        if: env.IS_PR == 'true'
        run: |
          git show HEAD:dist/gl_data.json > /tmp/committed_gl_data.json
          python3 scripts/compare_dist.py /tmp/committed_gl_data.json dist/gl_data.json
          git diff --stat -- dist

      - name: 빌드 결과 미리보기 업로드 (PR 전용)
        if: env.IS_PR == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dist-preview
          path: |
            dist/index.html
            dist/en.html
            dist/gl_data.json
          retention-days: 7

      - name: 변경사항 커밋
        if: env.IS_PR != 'true'
        run: |
          git config user.name  "gl-bot"
          git config user.email "gl-bot@users.noreply.github.com"
          git add dist
          if git diff --staged --quiet; then
            echo "변경 없음 — 신규 데이터가 아직 발표되지 않았습니다"
          else
            git commit -m "chore: GL 데이터 자동 갱신 ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Stage public files only
        if: env.IS_PR != 'true'
        run: |
          mkdir -p dist-public
          cp dist/index.html dist/en.html dist/gl_data.json dist-public/

      - name: GitHub Pages 업로드
        if: env.IS_PR != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-public

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # 정기·수동 실행이 실패하면 이슈를 열어(이미 열려 있으면 댓글) 메일 알림이 가게 합니다.
  notify-failure:
    needs: [build, deploy]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = 'GL 자동 갱신 실패';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `자동 갱신이 실패했습니다.\n\n- 실행 기록: ${run}\n- 이벤트: ${context.eventName}\n- 시각(UTC): ${new Date().toISOString()}\n\n수정 후 Actions에서 다시 실행하고, 성공하면 이 이슈를 닫아 주세요.`;
            const open = await github.paginate(github.rest.issues.listForRepo, {...context.repo, state: 'open', per_page: 100});
            const existing = open.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({...context.repo, issue_number: existing.number, body});
            } else {
              await github.rest.issues.create({...context.repo, title, body});
            }
