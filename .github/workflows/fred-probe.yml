# FRED 공식 API 접속 시험 (GitHub 호스티드 ubuntu 러너)
# update.yml·배포와 무관합니다. 데이터 커밋, Pages 배포를 하지 않습니다.
name: FRED 접속 시험 (ubuntu)

on:
  workflow_dispatch:
    inputs:
      series:
        description: "시험할 FRED 시리즈 (공백 구분)"
        default: "DGS2 ICSA"
        required: true
      run_backtest:
        description: "일간 레이더 백테스트도 실행해 아티팩트로 올리기"
        type: boolean
        default: false
  # workflow_dispatch는 기본 브랜치(main)에 이 파일이 있어야 Actions 화면에 버튼이 생깁니다.
  # main을 건드리지 않고 시험하려고, 작업 브랜치에서 이 파일이 바뀌어 푸시될 때만 한 번 실행합니다.
  push:
    branches: [claude/dreamy-noether-8apapo]
    paths: [.github/workflows/fred-probe.yml, scripts/daily_radar_backtest.py]

permissions:
  contents: read

concurrency:
  group: fred-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      SERIES: ${{ inputs.series || 'DGS2 ICSA' }}
      # 푸시로 실행될 때는 백테스트까지 돌립니다(입력값이 없으므로).
      RUN_BACKTEST: ${{ github.event_name == 'push' || inputs.run_backtest }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 러너 정보
        run: |
          echo "runner: $RUNNER_OS $RUNNER_ARCH / $(python --version)"

      - name: FRED 공식 API 접속 시험
        run: python scripts/fred_probe.py $SERIES --csv

      - name: 백테스트 의존성 설치
        if: env.RUN_BACKTEST == 'true'
        run: python -m pip install --quiet "pandas>=2.2" numpy

      - name: 일간 레이더 백테스트
        if: env.RUN_BACKTEST == 'true'
        run: |
          mkdir -p radar-out
          export GL_CACHE="$PWD/radar-out/cache" && mkdir -p "$GL_CACHE"
          start=$(date +%s)
          python scripts/daily_radar_backtest.py --compare-l --json radar-out/radar.json | tee radar-out/radar.md
          echo "elapsed: $(( $(date +%s) - start ))s" | tee -a radar-out/radar.md
          {
            echo "## 일간 레이더 L축 변형 비교 (G=D안)"
            echo
            grep -E '^\||^선택 규칙|^규칙상|^2단계|^- ' radar-out/radar.md
          } >> "$GITHUB_STEP_SUMMARY"
          # FRED 원자료 캐시는 재배포 문제를 피하려고 아티팩트에서 뺍니다.
          rm -rf "$GL_CACHE"

      - name: 결과 아티팩트 업로드
        if: env.RUN_BACKTEST == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: daily-radar-backtest
          path: radar-out/
          retention-days: 14

  # 같은 코드를 ubuntu에서 빌드해 v3 도입 커밋(0ba6ffb)의 dist와 비교합니다. 커밋·배포는 하지 않습니다.
  build-check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: ubuntu 빌드
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python build.py --out dist
      - name: v3 커밋 dist와 비교
        run: |
          git show 0ba6ffb:dist/gl_data.json > /tmp/v3_gl_data.json
          python scripts/compare_dist.py /tmp/v3_gl_data.json dist/gl_data.json
